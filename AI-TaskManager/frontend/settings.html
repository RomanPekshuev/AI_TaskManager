<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Task Manager - Настройки</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header>
    <h1>AI Task Manager</h1>
    <nav>
      <a href="index.html">Главная</a>
      <a href="create.html">Создать</a>
      <a href="settings.html" class="active">Настройки</a>
    </nav>
  </header>

  <button onclick="logout()" class="btn-cancel" style="background:#e74c3c; color:white; border:none; padding:0.8rem 1.5rem; border-radius:6px; cursor:pointer;">Выйти из аккаунта</button>

  <main>
    <h2>Настройки</h2>

    <section class="settings-section">
      <h3>Профиль</h3>
      <div class="form-group">
        <label>Имя пользователя</label>
        <input type="text" value="Студент" disabled />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" value="student@university.ru" disabled />
      </div>
    </section>

    <section class="settings-section">
      <h3>Оформление</h3>
      <div class="form-group">
        <label>Тема интерфейса</label>
        <select id="theme-select">
          <option value="light" selected>Светлая</option>
          <option value="dark">Тёмная</option>
        </select>
      </div>
    </section>

    <section class="settings-section">
      <h3>Уведомления</h3>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" checked />
          Push-уведомления о дедлайнах
        </label>
      </div>
      <div class="checkbox-group">
        <label>
          <input type="checkbox" />
          Email-напоминания
        </label>
      </div>
    </section>

    <section class="settings-section">
      <h3>Статистика</h3>
      <div class="stats">
        <div class="stat-item">
          <span class="stat-number" id="total-tasks">0</span>
          <span class="stat-label">Всего задач</span>
        </div>
        <div class="stat-item">
          <span class="stat-number" id="completed-tasks">0</span>
          <span class="stat-label">Выполнено</span>
        </div>
      </div>
    </section>

    <div class="form-actions">
      <button class="btn-submit" onclick="alert('Настройки сохранены!')">Сохранить</button>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 AI Task Manager. Учебный проект.</p>
  </footer>

  <script type="module">
    import { getTasks } from './js/api.js';

    import { logout } from './js/api.js';
    window.logout = logout; 

    async function loadStats() {
      try {
        const tasks = await getTasks();
        document.getElementById('total-tasks').textContent = tasks.length;
        document.getElementById('completed-tasks').textContent = 
          tasks.filter(t => t.completed).length;
      } catch (error) {
        console.error('Не удалось загрузить статистику:', error);
      }
    }

    loadStats();

    document.getElementById('theme-select').addEventListener('change', (e) => {
      if (e.target.value === 'dark') {
        document.body.style.background = '#1a1a2e';
        document.body.style.color = '#eee';
      } else {
        document.body.style.background = '#f5f7fa';
        document.body.style.color = '#333';
      }
    });
  </script>

</body>
</html>
