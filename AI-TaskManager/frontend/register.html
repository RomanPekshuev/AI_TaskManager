<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Регистрация | AI Task Manager</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-container">
    <h2>Создание аккаунта</h2>
    <form id="register-form" class="task-form">
      <div class="form-group">
        <label>Имя</label>
        <input type="text" id="reg-username" required placeholder="Иван" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" required placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="reg-password" required minlength="6" placeholder="Минимум 6 символов" />
      </div>
      <button type="submit" class="btn-submit">Зарегистрироваться</button>
      <p class="auth-link">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      <div id="reg-message" class="message"></div>
    </form>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
